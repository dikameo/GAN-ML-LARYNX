# Konfigurasi dasar. Tidak ada angka ajaib di kode: semua nilai tetap ada di sini.
# Sumber nilai: PRD.md (bagian/ID di komentar). Keputusan sesi ini: configs/decisions.yaml.

seed: 42                      # seed global; seed job = job_seed(seed, skenario, rep, lipatan)

paths:
  # Versi 2 (tanpa Docker): jalur relatif terhadap folder Versi 2, diselesaikan oleh load_merged() di notebook.
  # Dataset berada di luar kedua versi (Training/data), dipakai bersama dan tidak disalin. Baca-saja TIDAK dapat dipaksa di Windows; hanya disiplin (RULES §2, dicatat di LOG.md).
  dataset: ../data/Larynx_CE-NBI_Dataset
  outputs: outputs
  hf_cache: outputs/hf_cache

model:
  hf_name: microsoft/swin-tiny-patch4-window7-224   # PRD §14, FR-05
  num_classes: 2
  input_size: 224                                    # PRD §5 langkah 3
  pretrained: true
  arch_overrides: null          # hanya dipakai uji tiruan (model kecil tanpa bobot)

preprocess:                     # FR-02, FR-03
  cache_size: 256               # PRD §5 langkah 3 (GAN 256; klasifikator di-resize ke 224 saat dibaca)
  normalize: imagenet           # keputusan 2026-11-08 (mengubah PRD §5 langkah 4); diterapkan saat dibaca, tidak di cache
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  workers: 2
  fov:                          # langkah 2: area pandang = ambang intensitas + isi lubang + komponen terbesar
    threshold: 15
    min_area_fraction: 0.05     # di bawah ini dianggap deteksi gagal -> seluruh citra dipakai (ditandai fov_fallback)
  quality:                      # langkah 1: metrik dihitung dan dilaporkan; TIDAK ada citra dibuang (keputusan 2026-11-08)
    filter_enabled: false
    saturation_level: 250
    dark_level: 30
  roi:                          # langkah 5, nilai awal dari ROI_Figure/roi_figure.py; dikunci setelah pemeriksaan visual 50 citra
    locked: false
    filter: frangi              # pembuat ROI; metrik pembuluh GAN wajib memakai filter lain (L6)
    sigmas: [1, 1.5, 2, 3]
    alpha: 0.5
    beta: 0.5
    gamma: null
    threshold: 0.10
    min_obj: 30
    fov_erode: 4                # roi_figure.py memakai 15 px pada citra ~1000 px; diskalakan ke 256 px
    green_blur: 1.0
    norm_percentile: 99.5
  roi_examples:
    n: 50                       # FR-03, D6: ID pasien 50 citra dicatat
    seed: 42

audit:                          # FR-01
  reference_tabel_3_2:          # PRD §5 / Tabel 3.2 proposal
    patients: {benign: 150, malignant: 60}
    images: {benign: 7657, malignant: 3487}
  reference_kiani:              # repo Kiani dkk. (PRD §5), hanya untuk perbandingan
    patients: {benign: 151, malignant: 59}
    images: {benign: 7715, malignant: 3442}
  s7_min_patients_per_class: 10 # syarat S7 (PRD §6)

splits:                         # FR-04
  n_splits: 5
  n_repeats: 1                  # Versi 2: satu 5-fold CV (10 GAN: 5 S5 + 5 S6), revisi.md; PRD §8 mengizinkan, dicatat di LOG.md
  val_fraction: 0.15

compute:
  torch_threads: null           # null = semua CPU yang terlihat di kontainer (CP0 mendapati default torch hanya 1 thread)
  amp: true                     # campuran presisi fp16, hanya aktif bila CUDA tersedia (klasifikator; GAN selalu fp32)

loader:
  num_workers: auto             # auto = 0 di CPU, min(6, cpu-1) di GPU; atau angka

augment:                        # "augmentasi klasik" (keputusan 2026-11-08: tanpa color jitter, warna NBI bersifat diagnostik)
  crop_scale: [0.8, 1.0]
  crop_ratio: [0.9, 1.1]
  rotation_deg: 10
  hflip: true
  vflip: true

train:                          # FR-05
  optimizer: adamw
  lr: 1.0e-4                    # LR konstan (tanpa jadwal), keputusan 2026-11-08
  weight_decay: 0.05
  batch_size: 32
  max_epochs: 30
  early_stop_patience: 5
  early_stop_metric: val_loss_balanced   # rata-rata loss per kelas pada pasien validasi
  min_delta: 0.0
  weighted_sampling: true
  checkpoint_every_epochs: 1

s2:                             # FR-08
  embed_batch_size: 32
  c_grid: [0.01, 0.1, 1.0, 10.0]   # dipilih dari val loss pasien validasi di dalam lipatan latih (L4)
  smote_k: 5
  smote_strategy: auto          # seimbang 1:1
  max_iter: 1000

splits_name: main               # main | s7 (berkas splits.json atau splits_s7.json)

radiomics:                      # FR-08 (S3, S4); D7: mask = area pandang karena tidak ada mask lesi
  mask: fov                     # fov | roi
  channel: gray                 # gray | green
  bin_width: 25
  workers: null                 # null = semua CPU
  chunk: 256

s3:                             # replikasi Wang dkk., semua pada fitur radiomik
  model: svm                    # svm | lda
  lasso_alpha: 0.001            # D3: proposal; 0.01 = analisis sensitivitas (eksploratif)
  lasso_max_iter: 10000
  svm_C: 1.0
  smote_k: 5
  ctgan: null                   # null = S3; blok di bawah (s4_ctgan) dipakai bila use_ctgan: true
  use_ctgan: false

s4_ctgan:                       # S4: GAN pada ruang fitur, 50% data latih (reproduksi Wang dkk.)
  epochs: 100
  batch_size: 50                # harus kelipatan pac=10
  synth_fraction: 0.5
  cuda: auto

synthetic: null                 # {gan_scenario: S6, ratio: 0.25 | best}; diisi oleh s5/s6/s7_* via CLI atau yaml

gan:                            # FR-06; implementasi ringkas bergaya StyleGAN2 (lihat D8)
  resolution: 256
  z_dim: 256
  w_dim: 256
  map_layers: 4
  channels: {4: 256, 8: 256, 16: 256, 32: 256, 64: 128, 128: 64, 256: 32}
  d_channels: {256: 32, 128: 64, 64: 128, 32: 256, 16: 256, 8: 256, 4: 256}
  droi_d_channels: {256: 16, 128: 32, 64: 64, 32: 128, 16: 128, 8: 128, 4: 128}   # Versi 2: D_roi setengah lebar D (revisi.md); null = sama dengan d_channels
  batch_size: 32                # batch EFEKTIF (tidak berubah, hasil ilmiah sebanding dengan Versi 1)
  micro_batch: 16               # Versi 2: potongan per langkah GPU (gradient accumulation); batch_size harus kelipatan micro_batch.
                                # Turunkan ke 8 atau 4 bila OOM pada 8 GB VRAM. Belum diimplementasikan, ditulis di notebook 04.
  lr_g: 2.0e-4
  lr_d: 2.0e-4
  betas: [0.0, 0.99]
  r1_gamma: 10.0
  r1_interval: 16
  ema_kimg: 10.0
  total_kimg: 500               # SEMENTARA: tetapkan dari benchmark GAN di notebook 00 (PRD §8 Fase 0). Angka 400-800 kimg di revisi.md
                                # mengandaikan transfer learning StyleGAN2-ADA resmi; TIDAK berlaku untuk GAN dari nol ini.
  snapshot_kimg: 25             # last.pt dan FID dipantau tiap ini
  fid_samples: 500              # HANYA pemantauan FID tiap snapshot (cepat, kasar); BUKAN dasar pemilihan lambda
  fid_fake_samples: 5000        # citra palsu untuk FID laporan/pilot (quality_report); dirata-ratakan atas 3 seed pembangkitan
  lambda_roi: 0.0               # S5=0; S6 membaca outputs/cp4/lambda_selection.json bila null
  ada:
    enabled: true
    target: 0.6
    kimg: 500
    interval: 4
  vesselness:                   # Frangi diferensiabel untuk D_roi (bukan skimage; lihat D8)
    sigmas: [1.0, 1.5, 2.0, 3.0]
    beta: 0.5
    c: 0.08
    blur: 1.0
    fov_thr: -0.9               # piksel dengan max kanal <= ini dianggap di luar area pandang (rentang [-1,1])
    fov_erode: 4
    norm: 0.25
    threshold: 0.2
    temperature: 0.05
  quality:                      # FR-11; L6: filter evaluasi harus berbeda dari preprocess.roi.filter
    vessel_filter: sato
    vessel_sigmas: [1.0, 2.0, 3.0]
    vessel_threshold: 0.02
    n_grid: 100                 # 100 citra sintetis per kelas untuk pemeriksaan visual
    lpips_pairs: 500
    lpips_net: alex
  generate_fraction: 1.0        # FR-07: 100% jumlah citra ganas asli dibangkitkan sekali
  ratios: [0.25, 0.5, 1.0]      # G2

pilot:                          # D2
  rep: 0
  fold: 0
  lambdas: [0.1, 0.5, 1.0, 2.0]
  criterion: val_fid
  total_kimg: null              # null = gan.total_kimg

s7:                             # PRD §6; keputusan di decisions.yaml
  n_repeats: 3                  # pembagian latih/validasi acak atas pasien 1280x1008
  methods: [S1, S5, S6]

eval:                           # FR-09, FR-10
  threshold: 0.5                # tetap (L4)
  bootstrap_reps: 2000
  ci_level: 0.95
  bootstrap_seed: 42
  average_repeats: true         # D4 (rekomendasi PRD, menunggu konfirmasi)

benchmark:                      # hanya untuk CP0
  warmup_steps: 2
  timed_steps: 6
  # Asumsi ukuran latih untuk ekstrapolasi satu epoch: 11.144 citra x 80% x 85%. Asumsi, bukan pengukuran.
  assumed_train_images: 7578
